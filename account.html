<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Kandd Learning</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-nav.css"><link rel="stylesheet" href="kandd-page-polish.css"><script defer src="site-nav.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><span class="tag">My Account</span></header><main class="wrap kandd-polished-page"><section class="hero"><span class="pill">KANDD LEARNING</span><h1>My Account</h1><p>Sign in or create an account to keep your lessons and progress together.</p></section><div class="grid2"><article><h2>Create Account</h2><label>First name<input id="first" class="forminput" autocomplete="given-name"></label><label>Email<input id="signupEmail" class="forminput" type="email" autocomplete="email"></label><label>Password<input id="signupPassword" class="forminput" type="password" minlength="8" autocomplete="new-password"></label><label>My native language<select id="native" class="forminput"><option value="es">Español</option><option value="fr">Français — coming soon</option><option value="de">Deutsch — coming soon</option><option value="pt">Português — coming soon</option><option value="it">Italiano — coming soon</option></select></label><button class="btn" onclick="signup()">Create Account</button><div id="signupMsg" class="feedback"></div></article><article><h2>Sign In</h2><label>Email<input id="loginEmail" class="forminput" type="email" autocomplete="email"></label><label>Password<input id="loginPassword" class="forminput" type="password" autocomplete="current-password"></label><button class="btn" onclick="login()">Sign In</button><p><a href="forgot-password.html">Forgot your password?</a></p><div id="loginMsg" class="feedback"></div></article></div></main><script src="supabase-client.js"></script><script>

async function signup(){signupMsg.textContent='Creating your account…';const email=signupEmail.value.trim(),password=signupPassword.value,first_name=first.value.trim(),native_language=native.value;if(!first_name||!email||password.length<8){signupMsg.className='feedback retry';signupMsg.textContent='Enter your first name, email, and a password of at least 8 characters.';return}const {data,error}=await kanddDb.auth.signUp({email,password,options:{emailRedirectTo:'https://bdkan98.github.io/EnglishforLife/account.html',data:{first_name,native_language}}});if(error){signupMsg.className='feedback retry';signupMsg.textContent=error.message;return}signupMsg.className='feedback success';signupMsg.textContent=data.session?'Account created! Opening your dashboard…':'Check your email to confirm your account, then return here to sign in.';if(data.session)setTimeout(()=>location.href='dashboard.html',800)}
async function login(){loginMsg.textContent='Signing in…';const {error}=await kanddDb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error){loginMsg.className='feedback retry';loginMsg.textContent=error.message;return}try{localStorage.setItem('kandd-last-activity-v1',String(Date.now()));}catch(e){}location.href='dashboard.html'}
</script></body></html>
