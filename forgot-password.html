<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | Kandd Learning</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">Kandd Learning</div></header><main class="wrap"><a class="home" href="account.html">← Sign In</a><section class="hero"><h1>Forgot your password?</h1><p>Enter your email and we'll send a reset link.</p><input id="email" class="forminput" type="email" placeholder="Email"><button class="btn" onclick="send()">Send Reset Link</button><div id="msg" class="feedback"></div></section></main><script src="supabase-client.js"></script><script>async function send(){const {error}=await kanddDb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:'https://bdkan98.github.io/EnglishforLife/reset-password.html'});msg.className='feedback '+(error?'retry':'success');msg.textContent=error?error.message:'Check your email for the password reset link.'}</script></body></html>
