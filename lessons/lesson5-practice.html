<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 5 Extra Practice | Kandd Learning</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../site-nav.css"><link rel="stylesheet" href="../teacher-center.css"><link rel="stylesheet" href="../kandd-buttons.css"><link rel="stylesheet" href="../kandd-phase2.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="../site-nav.js"></script></head><body><header class="top"><span class="tag">Lesson 5 Extra Practice</span></header><main class="wrap tc-wrap"><section class="hero"><span class="pill">LEVEL 1 · EXTRA PRACTICE</span><h1>Lesson 5: Time of Day</h1><p>Five optional questions to reinforce your learning. This activity does not change your lesson quiz score or completion.</p></section><article class="tc-card"><div id="questions"></div><button class="btn" id="check" type="button">Check my practice</button><p id="feedback" role="status" aria-live="polite"></p><a class="btn secondary" href="lesson5.html">← Return to Lesson 5</a></article></main><script>
const items=[["Which word means “mañana” (part of the day)?", ["night", "morning", "evening"], 1], ["Which word means “tarde” (part of the day)?", ["afternoon", "early", "night"], 0], ["Which word means “temprano”?", ["late", "after", "early"], 2], ["Which word means “después”?", ["before", "after", "evening"], 1], ["Which word means “noche”?", ["night", "morning", "afternoon"], 0]];
const target=document.getElementById('questions');
items.forEach((q,i)=>{const field=document.createElement('fieldset');field.style.cssText='border:0;border-bottom:1px solid #e0e8f0;padding:14px 0';const legend=document.createElement('legend');legend.textContent=(i+1)+'. '+q[0];legend.style.fontWeight='700';field.append(legend);q[1].forEach((option,j)=>{const label=document.createElement('label');label.style.cssText='display:block;padding:8px 0';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;label.append(input,document.createTextNode(' '+option));field.append(label)});target.append(field)});
document.getElementById('check').onclick=()=>{let correct=0,answered=0;items.forEach((q,i)=>{const chosen=document.querySelector('input[name="q'+i+'"]:checked');if(chosen){answered++;if(Number(chosen.value)===q[2])correct++}});const feedback=document.getElementById('feedback');if(answered!==items.length){feedback.textContent='Please answer all five questions.';return}feedback.textContent='You answered '+correct+' of 5 correctly. '+(correct===5?'Great work!':'Review the lesson and try again.')};
</script></body></html>
