<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-nav.css"><link rel="stylesheet" href="kandd-page-polish.css"><link rel="stylesheet" href="kandd-compact.css"><script defer src="site-nav.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Sign In | Kandd Learning</title></head><body><header class="top"><a href="index.html" class="brand">Kandd Learning</a></header><main class="wrap kandd-polished-page"><section class="hero"><span class="pill">WELCOME BACK</span><h1>Sign In</h1><p>Continue your English learning.</p></section><article style="max-width:520px;margin:24px auto"><label>Email<input id="loginEmail" class="forminput" type="email" autocomplete="email"></label><label>Password<input id="loginPassword" class="forminput" type="password" autocomplete="current-password"></label><button class="btn" onclick="login()">Sign In</button><p><a href="forgot-password.html">Forgot your password?</a></p><p>New to Kandd Learning? <a href="signup.html"><strong>Create an account</strong></a></p><div id="loginMsg" class="feedback" role="status"></div></article></main><script src="supabase-client.js"></script><script>async function login(){loginMsg.textContent='Signing in…';const {error}=await kanddDb.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error){loginMsg.className='feedback retry';loginMsg.textContent=error.message;return}try{localStorage.setItem('kandd-last-activity-v1',String(Date.now()));}catch(e){}location.href='dashboard.html'}
</script></body></html>
