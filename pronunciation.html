<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pronunciation Helper | Kandd Learning</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-nav.css"><link rel="stylesheet" href="teacher-center.css"><link rel="stylesheet" href="kandd-page-polish.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="site-nav.js"></script></head><body><header class="top"><span class="tag">Pronunciation Helper</span></header><main class="wrap tc-wrap kandd-polished-page"><section class="hero"><h1>Pronunciation Helper</h1><p>Hear English words and practice pronunciation. Save unfamiliar words and suggest vocabulary for future lessons.</p></section><article class="tc-card"><label for="word">English word or short phrase</label><input id="word" maxlength="80" placeholder="Example: comfortable"><label for="language">My native language</label><select id="language"><option>Spanish</option><option>French</option><option>Portuguese</option><option>German</option><option>Italian</option><option>Other</option></select><p><button id="lookup" class="btn">Look up word</button></p><div id="result" role="status"></div><div id="actions" hidden><p><button id="listen" class="btn secondary">🔊 Hear English pronunciation</button> <button id="save" class="btn secondary">Save to My Vocabulary</button> <button id="suggest" class="btn secondary">Suggest for lessons</button></p></div><p id="message" role="status"></p></article><article class="tc-card"><h2>My Vocabulary</h2><p>Sign in to save words across devices.</p><div id="saved">Sign in to view your saved words.</div></article><p><a href="student/my-teacher.html">My Teacher</a> · <a href="dashboard.html">My Lessons</a></p></main><script src="supabase-client.js"></script><script src="lesson-vocabulary-index.js"></script><script>
const $=id=>document.getElementById(id);
// Reviewed Spanish-friendly approximations from the earlier Kandd pronunciation helper.
// Other languages use browser speech only until verified native-language guides are available.
const spanish={hello:'jel-ÓU',morning:'MÓR-ning',beautiful:'BIÚ-ti-fol',work:'uérk',school:'skúl',family:'FÁ-mi-li',daughter:'DÓ-ter',brother:'BRÁ-der',water:'UÓ-ter',please:'plíiz',appointment:'a-PÓINT-ment',pharmacy:'FÁR-ma-si',bus:'bas',shopping:'SHÓ-ping',schedule:'SKÉ-dyul',directions:'di-RÉK-shons',transportation:'trans-por-TÉI-shon',english:'ÍNG-glish',name:'néim',friend:'frend',today:'tu-DÉI',tomorrow:'tu-MÓ-rou',price:'prais',right:'rait',left:'left',help:'jelp',learn:'lern'};
let active='';function message(t){$('message').textContent=t}
async function loadSaved(){try{if(!await kanddUser())return;const {data,error}=await kanddDb.rpc('kandd_my_saved_words');if(error)throw error;const el=$('saved');el.replaceChildren();if(!data?.length){el.textContent='No saved words yet.';return}for(const w of data){const p=document.createElement('p');p.textContent=w.word+' ('+w.native_language+')';el.append(p)}}catch(e){message(e.message)}}
$('lookup').onclick=async()=>{const w=$('word').value.toLowerCase().trim().replace(/\s+/g,' ');if(!/^[a-z][a-z '-]{0,79}$/.test(w)){message('Please enter an English word or short phrase using letters.');return}active=w;message('');$('actions').hidden=false;const el=$('result');el.replaceChildren();const title=document.createElement('h2');title.textContent=w;el.append(title);const p=document.createElement('p');const lang=$('language').value;if(lang==='Spanish'&&spanish[w]){p.textContent='Spanish-friendly pronunciation guide: '+spanish[w]+' (approximation; listen to the audio for accuracy).'}else{p.textContent='A verified '+lang+'-language phonetic guide is not yet available for this word. Use English audio to hear the pronunciation; we will not invent a phonetic spelling.'}el.append(p);const status=document.createElement('p');const lesson=window.kanddLessonVocabulary?.[w];status.textContent=lesson?'This word is taught in Lesson '+lesson+'.':'This word is not in the current 12-lesson vocabulary list. You can suggest it for a future lesson.';el.append(status)};
$('listen').onclick=()=>{if(!active)return;if(!('speechSynthesis'in window)){message('Audio playback is not supported by this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(active);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)};
async function doRpc(fn){if(!active){message('Look up a word first.');return}try{if(!await kanddUser()){message('Sign in to save or submit words.');return}const args={p_word:active,p_native_language:$('language').value};const {data,error}=await kanddDb.rpc(fn,args);if(error)throw error;message(data);if(fn==='kandd_save_word')await loadSaved()}catch(e){message(e.message)}}
$('save').onclick=()=>doRpc('kandd_save_word');$('suggest').onclick=()=>doRpc('kandd_submit_vocabulary');loadSaved();
</script></body></html>
