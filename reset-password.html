<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose New Password | Kandd Learning</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="brand">Kandd Learning</div></header><main class="wrap"><section class="hero"><h1>Choose a new password</h1><input id="pw" class="forminput" type="password" minlength="8" placeholder="New password"><button class="btn" onclick="updatePw()">Update Password</button><div id="msg" class="feedback"></div></section></main><script src="supabase-client.js"></script><script>async function updatePw(){if(pw.value.length<8){msg.className='feedback retry';msg.textContent='Use at least 8 characters.';return}const {error}=await kanddDb.auth.updateUser({password:pw.value});msg.className='feedback '+(error?'retry':'success');msg.innerHTML=error?error.message:'Password updated. <a href="account.html">Sign in →</a>'}</script></body></html>
