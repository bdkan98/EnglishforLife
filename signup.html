<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-nav.css"><link rel="stylesheet" href="kandd-page-polish.css"><link rel="stylesheet" href="kandd-compact.css"><script defer src="site-nav.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Create Account | Kandd Learning</title></head><body><header class="top"><a href="index.html" class="brand">Kandd Learning</a></header><main class="wrap kandd-polished-page"><section class="hero"><span class="pill">GET STARTED</span><h1>Create Account</h1><p>Start learning practical English.</p></section><article style="max-width:520px;margin:24px auto"><label>First name<input id="first" class="forminput" autocomplete="given-name"></label><label>Email<input id="signupEmail" class="forminput" type="email" autocomplete="email"></label><label>Password<input id="signupPassword" class="forminput" type="password" minlength="8" autocomplete="new-password"></label><label>My native language<select id="native" class="forminput"><option value="es">Español</option><option value="fr">Français — coming soon</option><option value="de">Deutsch — coming soon</option><option value="pt">Português — coming soon</option><option value="it">Italiano — coming soon</option></select></label><button class="btn" onclick="signup()">Create Account</button><p>Already have an account? <a href="login.html"><strong>Sign In</strong></a></p><div id="signupMsg" class="feedback" role="status"></div></article></main><script src="supabase-client.js"></script><script>async function signup(){signupMsg.textContent='Creating your account…';const email=signupEmail.value.trim(),password=signupPassword.value,first_name=first.value.trim(),native_language=native.value;if(!first_name||!email||password.length<8){signupMsg.className='feedback retry';signupMsg.textContent='Enter your first name, email, and a password of at least 8 characters.';return}const {data,error}=await kanddDb.auth.signUp({email,password,options:{emailRedirectTo:'https://bdkan98.github.io/EnglishforLife/login.html',data:{first_name,native_language}}});if(error){signupMsg.className='feedback retry';signupMsg.textContent=error.message;return}signupMsg.className='feedback success';signupMsg.textContent=data.session?'Account created! Opening your dashboard…':'Check your email to confirm your account, then return here to sign in.';if(data.session)setTimeout(()=>location.href='dashboard.html',800)}
</script></body></html>
