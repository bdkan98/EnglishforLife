<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard | Kandd Learning</title><link rel="stylesheet" href="../styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="../site-nav.css"><script defer src="../site-nav.js"></script></head><body><header class="top"><a class="brand" href="../index.html">Kandd Learning</a><span class="tag">Teacher Dashboard</span></header><main class="wrap"><section class="hero"><h1>Welcome, Teacher</h1><p id="state" role="status">Checking your approval…</p><div id="teacherContent" hidden><p>Your Kandd Learning teacher account has been approved.</p><p>Teacher materials will be moved into secure storage in a later update. Existing public teaching guides are not protected by this login.</p><a class="btn" href="index.html">View Current Teacher Center →</a></div></section></main><script src="../supabase-client.js"></script><script>
(async()=>{const el=document.getElementById('state');try{const user=await kanddUser();if(!user){el.textContent='Please sign in first.';return}const {data,error}=await kanddDb.from('kandd_teacher_applications').select('status').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data?.status!=='approved'){el.textContent='Teacher access has not been approved.';return}el.textContent='Approval confirmed.';document.getElementById('teacherContent').hidden=false}catch(e){el.textContent='Unable to verify teacher access.';console.error(e)}})();</script></body></html>
